services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=camerarent
    networks:
      - camera-rent-network

  backend:
    image: pasindumanmeth/camerarent-backend:latest
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/camerarent
      - MONGO_URI=mongodb://mongodb:27017/camerarent
      - JWT_SECRET=your-secret-key-change-in-production
    depends_on:
      - mongodb
    networks:
      - camera-rent-network

  frontend:
    image: pasindumanmeth/camerarent-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - camera-rent-network

networks:
  camera-rent-network:
    driver: bridge

volumes:
  mongodb_data:
